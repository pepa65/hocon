[package]
name = "hocon_"
version = "0.10.16"
edition = "2024"
authors = ["François Mockers <mockersf@gmail.com>", "Mathias Oertel <mathias.oertel@gmail.com>", "<github.com/pepa65>"]
description = "Read HOCON configuration files"
repository = "https://github.com/pepa65/hocon"
documentation = "https://docs.rs/hocon"
readme = "README.md"
license = "MIT"
keywords = ["hocon", "configuration"]

[dependencies]
thiserror = "2.0"
nom = "8.0"
serde = { version = "1.0", optional = true }
java-properties = "2.0"
memchr = "2.7"
reqwest = { version = "0.13", optional = true, default-features = false, features = [ "blocking", "rustls" ] }
uuid = { version = "1.20", features = [ "v4" ] }
serde_path_to_error = "0.1"
aho-corasick = "1.1"
linked-hash-map = "0.5"

[dev-dependencies]
test-generator = "0.3"
insta = "1.46"
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"
criterion = "0.8"
rand = "0.9"

[features]
default = [ "test-snapshot", "serde-support", "url-support" ]
test-snapshot = []
serde-support = [ "serde" ]
url-support = [ "reqwest" ]

[[bench]]
name = "parse"
harness = false
